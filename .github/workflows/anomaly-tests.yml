name: Anomaly detection tests

on:
  push:
    paths: ['anomaly/**', 'tests/test_anomaly.py', 'requirements-anomaly.txt', '.github/workflows/anomaly-tests.yml']
  pull_request:
    paths: ['anomaly/**', 'tests/test_anomaly.py', 'requirements-anomaly.txt', '.github/workflows/anomaly-tests.yml']

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy>=1.24,<3' pandas==2.2.2 'scipy>=1.10,<2' pytest
      - run: python -m pytest tests/test_anomaly.py -q
