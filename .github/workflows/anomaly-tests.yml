name: Anomaly detection tests

on:
  push:
    paths: ['benchmarks/**', 'tests/test_unsupervised_benchmark.py', 'requirements-benchmark.txt', 'anomaly/**', 'data/supervised_financial/**', 'scripts/data/**', 'tests/test_anomaly.py', 'tests/test_supervised_data.py', 'tests/test_transaction_data.py', 'tests/test_ieee_cis_local.py', 'requirements-anomaly.txt', '.github/workflows/anomaly-tests.yml']
  pull_request:
    paths: ['benchmarks/**', 'tests/test_unsupervised_benchmark.py', 'requirements-benchmark.txt', 'anomaly/**', 'data/supervised_financial/**', 'scripts/data/**', 'tests/test_anomaly.py', 'tests/test_supervised_data.py', 'tests/test_transaction_data.py', 'tests/test_ieee_cis_local.py', 'requirements-anomaly.txt', '.github/workflows/anomaly-tests.yml']

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy>=1.24,<3' pandas==2.2.2 'scipy>=1.10,<2' scikit-learn==1.7.2 pytest
      - run: python -m pytest tests/test_anomaly.py tests/test_supervised_data.py tests/test_transaction_data.py tests/test_ieee_cis_local.py tests/test_unsupervised_benchmark.py -q
